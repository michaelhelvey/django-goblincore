[project]
name = "goblincore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "channels[daphne]>=4.3.2",
  "django>=6.0.2",
  "django-filter>=25.2",
  "djangorestframework>=3.16.1",
  "drf-restwind>=1.2.0",
  "factory-boy>=3.3.3",
  "pytest-factoryboy>=2.8.1",
  "pytest-pyspec>=1.1.1",
  "python-dotenv>=1.2.1",
  "servestatic>=3.1.0",
]

[dependency-groups]
dev = [
  "djhtml>=3.0.10",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-django>=4.11.1",
  "pytest-mock>=3.15.1",
  "ruff>=0.14.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "goblincore.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--reuse-db", "--strict-markers", "--tb=short", "--pyspec"]
markers = ["slow: marks tests as slow", "integration: marks tests as integration tests"]
testpaths = ["app"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app", "goblincore"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__pycache__/*",
  "*/venv/*",
  "goblincore/settings.py",
  "goblincore/asgi.py",
  "goblincore/wsgi.py",
  "app/management/commands/runserver.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "DJ", # flake8-django
]
ignore = [
  "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501", "F401"]
"*/tests/*.py" = ["B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
no-sections = true

{% extends "base.html" %}

{% block title %}Login - Goblincore{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center p-4">
    <div class="card bg-base-200 w-full max-w-md shadow-xl">
        <div class="card-body space-y-4">
            <h2 class="card-title text-2xl font-bold">Login</h2>
            
            {% if form.non_field_errors %}
                <div role="alert" class="alert alert-error">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{{ form.non_field_errors }}</span>
                </div>
            {% endif %}
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <label class="form-control w-full">
                    <div class="label">
                        <span class="label-text font-semibold">Email</span>
                    </div>
                    <input type="email" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}" class="input input-bordered w-full" placeholder="your.email@example.com" value="{{ form.username.value|default:'' }}" required>
                    {% if form.username.errors %}
                        <div class="label">
                            <span class="label-text-alt text-error">{{ form.username.errors.0 }}</span>
                        </div>
                    {% endif %}
                </label>
                
                <label class="form-control w-full">
                    <div class="label">
                        <span class="label-text font-semibold">Password</span>
                    </div>
                    <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}" class="input input-bordered w-full" placeholder="Enter your password" required>
                    {% if form.password.errors %}
                        <div class="label">
                            <span class="label-text-alt text-error">{{ form.password.errors.0 }}</span>
                        </div>
                    {% endif %}
                </label>
                
                <button type="submit" class="btn btn-primary btn-block mt-6">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

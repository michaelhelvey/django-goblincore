{% extends "base.html" %}

{% block title %}Delete {{ object.name }} - {{ block.super }}{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-16rem)] flex items-center justify-center p-4">
    <div class="card bg-base-200 w-full max-w-md shadow-xl">
        <div class="card-body">
            <h2 class="card-title text-2xl text-error mb-4">Confirm Delete</h2>
            
            <div role="alert" class="alert alert-warning mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>This action cannot be undone!</span>
            </div>
            
            <p class="mb-2">Are you sure you want to delete this widget?</p>
            <p class="text-lg font-semibold mb-6">"{{ object.name }}"</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="card-actions justify-end">
                    <a href="{% url 'widget-detail' object.pk %}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-error">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}{% if object %}Edit{% else %}Create{% endif %} Widget - {{ block.super }}{% endblock %}

{% block content %}
<h1>{% if object %}Edit Widget{% else %}Create New Widget{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'widget-list' %}">Cancel</a>
</form>
{% endblock %}
